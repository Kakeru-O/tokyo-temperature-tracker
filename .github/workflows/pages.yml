name: Deploy marimo WASM to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Build dbt models
        run: uv run dbt build --project-dir dbt --profiles-dir dbt

      - name: Export Pages data
        run: uv run python3 scripts/export_pages_data.py

      - name: Export marimo WebAssembly HTML
        run: uv run marimo export html-wasm main.py -o site --mode run --no-show-code

      - name: Copy Pages data
        run: |
          mkdir -p site/data/pages
          cp data/pages/*.csv site/data/pages/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
